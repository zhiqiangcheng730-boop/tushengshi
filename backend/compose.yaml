services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: shudekuai
      POSTGRES_USER: shudekuai
      POSTGRES_PASSWORD: ${SHUDEKUAI_POSTGRES_PASSWORD:?请设置本地数据库密码}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shudekuai -d shudekuai"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - shudekuai-postgres:/var/lib/postgresql/data

volumes:
  shudekuai-postgres:
