 var b=findDraft();

 if(b.error)return renderError();
 var n=count(b),manual=b.source==='manual',hasAuto=b.autoAvailable!==false&&b.autoCount!=null,delta=hasAuto?n-b.autoCount:0;

 else html+='<div class="edit-modes">'+[['view','浏览'],['add','补点'],['delete','删点']].map(function(m){return '<button class="'+(edit.mode===m[0]?'active':'')+'" data-action="edit-mode" data-mode="'+m[0]+'">'+m[1]+'</button>';}).join('')+'</div><div class="utility-row"><button class="text-btn" data-action="undo" '+(!edit.undo.length?'disabled':'')+'>'+icon('undo')+' 撤销</button><button class="text-btn" data-action="markers">'+icon('eye')+' '+(edit.visible?'隐藏标记':'显示标记')+'</button><button class="text-btn" data-action="numbers">编号'+(edit.numbers?'关':'开')+'</button><button class="text-btn" data-action="fit">还原视图</button></div>';
 return html+menuPrice()+'<div class="row"><button class="text-btn" data-action="retake-current">重拍本把</button><button class="text-btn" data-action="manual">人工录入数量</button></div>'+(edit.mode!=='view'&&!manual?'<p class="tiny muted" style="text-align:center;margin:0">'+(edit.mode==='add'?'点击漏掉的端面补点，蓝圈白点为新增。':'点击多余标记删除，操作后可以撤销。')+'</p>':'');
}
function batchCard(b,i){return '<div class="card batch-card"><div class="batch-top"><div class="batch-thumb">'+endImage(b.ends,false,null,true)+'</div><div class="batch-info"><strong>第'+(i+1)+'把</strong> <span class="chip '+(b.status==='confirmed'?'':'orange')+'">'+(b.status==='confirmed'?'已确认':'待处理')+'</span><p>'+esc((state.order.groups.find(function(g){return g.id===b.groupId;})||{}).name||'未分组')+' · '+(b.source==='manual'?'人工清点':'逐根复核')+'</p></div><div class="num batch-number">'+(b.status==='confirmed'?count(b):'—')+'<span class="tiny"> 根</span></div></div>'+(b.previous?'<div class="hint warn" style="margin-top:10px">原 '+count(b.previous)+' 根暂不计入合计</div>':'')+'<div class="batch-actions">'+(b.status==='confirmed'?'<button class="text-btn" data-action="batch-group" data-id="'+b.id+'">改组</button><button class="text-btn" data-action="retake" data-id="'+b.id+'">重拍本把</button>':'<button class="text-btn accent" data-action="resume-review">继续处理</button><button class="text-btn" data-action="cancel-revision">'+(b.previous?'取消重拍':'取消本把')+'</button>')+'<button class="text-btn danger" data-action="remove" data-id="'+b.id+'">移除</button></div></div>';}
function priceLines(s){return '<div class="price-summary">'+s.lines.map(function(l){return '<div class="row"><span>'+esc(l.name)+' <span class="muted">'+l.count+' × '+(l.price==null?'未定价':money(l.price))+'</span></span><span>'+(l.amount==null?'未计价':'¥'+money(l.amount))+'</span></div>';}).join('')+'<div class="row total-line"><span>签费小计</span><strong class="num">'+(s.amount==null?'未计价':'¥'+money(s.amount))+'</strong></div></div>';}
function renderSummary(){var o=state.order;if(!o||o.status!=='open')return '<div class="empty">'+icon('receipt')+'<h3>先开始一单清点</h3><p>每把确认后会在这里汇总。</p>'+btn('开始数签','begin','primary')+'</div>';var s=sum(o);return '<div class="task-context"><strong>'+esc(orderLabel(o))+'</strong><button class="text-btn accent" data-action="table">修改桌号</button></div><div class="card summary-total"><span class="num">'+s.count+'</span> 根<p>'+s.confirmed+'把已确认'+(s.pending?' · '+s.pending+'把待处理':' · 可继续新增下一把')+'</p></div>'+(s.pending?'<div class="hint warn" style="margin-top:12px">'+icon('info')+'<span>请先处理待确认批次，再完成本单。</span></div>':'')+(o.correctionOf?'<div class="hint" style="margin-top:12px">本单用于更正原单，完成后原单才会作废。</div><button class="text-btn danger" data-action="cancel-correction">放弃本次更正</button>':'')+'<div class="section-title">本桌签束<span>确认后放入已数区</span></div><div class="stack">'+(o.batches.length?o.batches.map(batchCard).join(''):'<div class="card empty"><h3>还没有签束</h3><p>拍摄或人工录入第一把。</p></div>')+'</div>'+priceLines(s)+'<p class="tiny muted">仅计算签费，不含其他菜品、酒水与优惠。</p>';}
function detailOrder(){return state.history.find(function(o){return o.id===state.detailId;})||(state.order&&state.order.status==='finalized'?state.order:state.history[0]);}
function renderComplete(){var o=detailOrder();if(!o)return '<div class="empty"><h3>还没有完成记录</h3></div>';var s=sum(o);return '<div class="complete-head"><div class="success-icon">'+icon(o.status==='void'?'close':'check')+'</div><h2>'+(o.status==='void'?'本单已作废':'清点完成')+'</h2><div class="small muted">'+esc(orderLabel(o))+' · '+s.confirmed+'把 · '+s.count+'根</div></div><div class="card ticket"><div class="row"><strong>巷口串串 · 示例门店</strong><span class="chip '+(o.status==='void'?'red':'')+'">'+(o.status==='void'?'已作废':'已保存')+'</span></div><div class="ticket-divider"></div><div class="receipt-value"><div class="small muted">签费小计</div><small>'+(s.amount==null?'':'¥')+'</small><span class="num">'+money(s.amount)+'</span></div>'+priceLines(s)+'<div class="ticket-divider"></div><div class="receipt-meta"><div class="row"><span>清点单号</span><span>'+esc(o.id.slice(-18).toUpperCase())+'</span></div><div class="row"><span>清点时间</span><span>'+esc(o.time)+'</span></div><div class="row"><span>经办人</span><span>'+esc(o.operator)+'</span></div>'+(o.correctionOf?'<div class="row"><span>记录类型</span><span>关联更正单</span></div>':'')+'</div></div><button class="text-btn" data-action="evidence" style="width:100%;margin-top:12px">'+icon('image')+' 查看各把数量与依据</button>'+(o.status!=='void'?'<button class="text-btn" data-action="correction" style="width:100%">'+icon('edit')+' 更正本单'+(state.role==='staff'?'（需店主）':'')+'</button>':'')+'<p class="tiny muted" style="text-align:center">本记录仅代表清点完成，不代表已收款。</p>';}
function renderHistory(){return '<div class="row" style="margin-bottom:18px"><div><h2 style="font-size:22px;margin:0">每一单，都有依据。</h2><div class="small muted">示例门店 · 今日记录</div></div><span class="chip gray">'+state.history.length+'单</span></div><div class="card record-list">'+state.history.map(historyItem).join('')+'</div><div class="hint" style="margin-top:16px">'+icon('info')+'<span>更正完成后，原单保留为作废记录，避免重复计入。</span></div>';}
function renderStore(){var owner=state.role==='owner';return '<div class="store-line"><div class="store-avatar" style="height:48px;width:48px;border-radius:15px">'+icon('store')+'</div><div><strong>巷口串串 · 示例门店</strong><div class="small muted">小林 · '+(owner?'店主':'店员（只读）')+'</div></div></div><div class="section-title">计价组<span>元／根</span></div><div class="card">'+state.storeGroups.map(function(g){return '<div class="price-input-row"><label for="price-'+g.id+'">'+esc(g.name)+'</label><input class="input" id="price-'+g.id+'" inputmode="decimal" value="'+(g.price==null?'':money(g.price))+'" placeholder="未定价" '+(!owner?'disabled':'')+' aria-label="'+esc(g.name)+'单价"></div>';}).join('')+'<p class="tiny muted" style="margin:16px 0 0">价格修改从下一单起生效，当前清点单保持原价。留空则只记数量。</p></div>'+btn(owner?'保存价格':'店员仅可查看价格','save-prices','primary full','style="margin-top:12px" '+(!owner?'disabled':''))+'<div class="section-title">门店成员<span>示例配置</span></div><div class="card"><div class="row"><div><strong>小林</strong><div class="tiny muted">'+(owner?'店主':'店员')+' · 当前账号</div></div><span class="chip">在店</span></div>'+btn('创建加入邀请','invite','soft full','style="margin-top:16px" '+(!owner?'disabled':''))+'</div><div class="section-title">照片与数据使用</div><div class="card"><div class="setting-row"><div><strong class="small">用于改进识别</strong><div class="tiny muted">独立选择，不影响正常清点</div></div><input class="toggle" type="checkbox" id="trainingToggle" aria-label="允许照片用于改进识别" '+(state.training?'checked':'')+' '+(!owner?'disabled':'')+'></div><div class="setting-row"><span class="small">示例保留期限</span><span class="tiny muted">图片30天 · 记录90天</span></div></div><p class="tiny muted" style="margin:12px 0">保留期限为待评审建议，真实上线前由门店确认。</p>';}
function renderJoin(){return '<div class="join-mark">数</div><div class="join-title"><h2>加入门店，开始清点。</h2><p>请向店主获取加入邀请。</p></div><div class="card"><span class="chip">示例邀请</span><h3 style="margin-top:16px">巷口串串 · 示例门店</h3><p class="small muted">加入后可清点、复核并查看本店记录。</p><div class="form-field"><label for="inviteInput">邀请码</label><input class="input" id="inviteInput" value="SHU826" autocomplete="off"></div>'+btn('加入示例门店','join-confirm','primary full')+'</div><p class="tiny muted" style="text-align:center;margin-top:20px">这里不创建真实微信身份或门店成员。</p>';}
function renderFooter(){switch(state.page){case'home':case'history':case'store':return tabs(state.page);case'capture':return '<div class="actionbar">'+btn(icon('camera')+'拍照识别','capture','primary')+'</div>';case'processing':return '<div class="actionbar">'+btn('返回，稍后继续','home','soft')+btn('取消本次识别','cancel-job','')+'</div>';case'review':var d=findDraft();if(d&&d.error)return '<div class="actionbar">'+btn('重新拍摄','retake-current','soft')+btn('重试识别','capture','primary')+'</div>';return '<div class="actionbar">'+btn('查看汇总','summary','')+btn('确认本把'+(d?' · '+count(d)+'根':''),'confirm','primary',!d||count(d)<1?'disabled':'')+'</div>';case'summary':var s=sum(state.order),disabled=!state.order||state.order.status!=='open'||!s.confirmed||!!s.pending;return '<div class="actionbar">'+btn(icon('plus')+'继续下一把','next-batch','soft')+btn('完成清点','finalize','primary',disabled?'disabled':'')+'</div>';case'complete':return '<div class="actionbar">'+btn('开始下一桌','next-table','primary')+'</div>';default:return '';}}
function render(){var p=state.page;if(!pageInfo[p])p=state.page='home';$('pageNav').innerHTML=Object.keys(pageInfo).map(function(k){return '<button class="nav-item '+(p===k?'active':'')+'" data-action="nav" data-page="'+k+'"><span class="nav-dot"></span>'+pageInfo[k].name+'</button>';}).join('');$('appbar').innerHTML=header();var views={home:renderHome,capture:renderCapture,processing:renderProcessing,review:renderReview,summary:renderSummary,complete:renderComplete,history:renderHistory,store:renderStore,join:renderJoin};$('screen').innerHTML=views[p]();$('footer').innerHTML=renderFooter();$('noteTitle').textContent=pageInfo[p].title;$('noteDesc').textContent=pageInfo[p].desc;$('noteList').innerHTML=pageInfo[p].notes.map(function(t){return '<li>'+esc(t)+'</li>';}).join('');$('scenarioSelect').value=state.scenario;$('roleSelect').value=state.role;bindImage();persist();}
function begin(){if(state.order&&state.order.status==='open'&&state.order.batches.length){openModal('当前还有未完成清点','<p>可以继续当前单，也可以保存草稿后另开一单。</p>'+btn('继续当前清点','resume','primary full')+btn('保留草稿，另开一单','archive-new','full'));}else{newOrder();navigate('capture');}}
function ensureDraft(){ensureOrder();var b=findDraft();if(!b){var n=state.order.batches.length===0?84:76;b={id:uid('batch'),status:'review',autoCount:null,autoAvailable:false,expectedCount:n,source:'points',manualCount:null,points:[],ends:n+1,groupId:state.groupId,revision:1};state.order.batches.push(b);}return b;}
function capture(){var b=ensureDraft();b.error=null;b.autoAvailable=false;b.autoCount=null;b.status='review';b.source='points';b.manualCount=null;b.points=[];resetEdit();var token=++jobToken,scenario=state.scenario;state.page='processing';render();clearTimeout(timer);timer=setTimeout(function(){if(token!==jobToken)return;var current=findDraft();if(!current||current.id!==b.id)return;if(scenario!=='normal'){current.error=scenario;state.error=scenario;}else{current.autoAvailable=true;current.autoCount=current.expectedCount||current.ends-1;current.points=pointsFor(current.ends).slice(0,current.autoCount);}var waiting=state.page==='processing';if(waiting)state.page='review';render();if(!waiting)toast('本把识别已结束，可从草稿继续复核');},1800);}
function manual(){ensureDraft();var b=findDraft();openModal('人工清点数量','<p>最终采用你录入的根数，保留自动结果供核对。</p><div class="form-field"><label for="manualCount">已人工核实的根数</label><input class="input manual-input" type="text" inputmode="numeric" id="manualCount" placeholder="输入根数" value="'+(b.source==='manual'?b.manualCount:'')+'"></div><div class="form-field"><label for="manualReason">录入原因</label><select class="input" id="manualReason"><option>人工清点核实</option><option>识别未完成</option><option>图片不适合识别</option></select></div><div class="field-error" id="manualError"></div>'+btn('采用人工数量','manual-save','primary full'));}
function pickGroup(batchId){ensureOrder();var b=batchId?state.order.batches.find(function(x){return x.id===batchId;}):findDraft();openModal('选择本把计价组','<p>使用当前清点单的价格快照。</p>'+state.order.groups.map(function(g){return '<button class="group-option '+((b?b.groupId:state.groupId)===g.id?'chosen':'')+'" data-action="group-set" data-id="'+g.id+'" data-batch="'+(batchId||'')+'"><span><strong>'+esc(g.name)+'</strong><br><small>'+(g.price==null?'仅记数量':money(g.price)+' 元／根')+'</small></span>'+icon('check')+'</button>';}).join(''));}
function startRetake(id){var b=state.order.batches.find(function(b){return b.id===id;});if(!b)return;if(b.status==='confirmed'){var old=clone(b);b.previous=old;b.status='review';b.revision++;b.error=null;}resetEdit();navigate('capture');}
function cancelRevision(){var b=findDraft();if(!b)return;var i=state.order.batches.indexOf(b);if(b.previous)state.order.batches[i]=clone(b.previous);else state.order.batches.splice(i,1);++jobToken;clearTimeout(timer);resetEdit();navigate('summary');toast(b.previous?'已恢复上一次确认的数量':'已取消本把');}
function finalize(){var o=state.order,s=sum(o);if(!o||o.status!=='open'||!s.confirmed||s.pending){toast('请先确认或取消所有待处理批次。');return;}o.status='finalized';o.time='今日 18:26';delete o.error;if(o.correctionOf){var old=state.history.find(function(h){return h.id===o.correctionOf;});if(old){old.status='void';old.replacedBy=o.id;}}state.history.unshift(clone(o));state.detailId=o.id;state.page='complete';render();toast('本单清点已保存');}
function editPoint(x,y,id){var b=findDraft();if(!b||b.source==='manual'||edit.mode==='view'||b.error)return;if(x<0||x>1||y<0||y>1)return;edit.undo.push(clone(b.points));if(edit.mode==='delete'){var index=-1;if(id)index=b.points.findIndex(function(p){return p.id===id;});if(index<0){var nearest=.038; b.points.forEach(function(p,i){var dist=Math.hypot(p.x-x,p.y-y);if(dist<nearest){nearest=dist;index=i;}});}if(index<0){edit.undo.pop();toast('请点击需要删除的标记。');return;}b.points.splice(index,1);}else{if(b.points.some(function(p){return Math.hypot(p.x-x,p.y-y)<.014;})){edit.undo.pop();toast('这里已有标记，请放大后检查。');return;}b.points.push({id:uid('added'),x:x,y:y,added:true});}render();}
function bindImage(){var viewport=$('imageViewport');if(!viewport)return;var svg=viewport.querySelector('svg'),pointers=new Map(),start=null,pinch=null;
 function coord(e){var rect=svg.getBoundingClientRect(),scale=Math.min(rect.width/360,rect.height/330),ox=(rect.width-360*scale)/2,oy=(rect.height-330*scale)/2;return {x:(e.clientX-rect.left-ox)/scale,y:(e.clientY-rect.top-oy)/scale};}
 viewport.addEventListener('pointerdown',function(e){if(e.target.closest('button'))return;var p=coord(e);pointers.set(e.pointerId,p);viewport.setPointerCapture(e.pointerId);if(pointers.size===2){var a=Array.from(pointers.values());pinch={distance:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),zoom:edit.zoom};if(start)start.moved=true;}else start={x:p.x,y:p.y,panX:edit.panX,panY:edit.panY,moved:false,id:e.target.closest('[data-point]')?e.target.closest('[data-point]').dataset.point:null};});
 viewport.addEventListener('pointermove',function(e){if(!pointers.has(e.pointerId))return;var p=coord(e);pointers.set(e.pointerId,p);if(pointers.size===2&&pinch){var a=Array.from(pointers.values());edit.zoom=Math.max(1,Math.min(3,pinch.zoom*Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)/Math.max(1,pinch.distance)));updateImageTransform();return;}if(start){var dx=p.x-start.x,dy=p.y-start.y;if(Math.hypot(dx,dy)>4)start.moved=true;if(start.moved&&edit.mode==='view'){edit.panX=start.panX+dx;edit.panY=start.panY+dy;updateImageTransform();}}});
 viewport.addEventListener('pointerup',function(e){var p=coord(e),s=start,multi=pointers.size>1;pointers.delete(e.pointerId);if(multi){pinch=null;start=null;return;}if(s&&!s.moved&&edit.mode!=='view'){var x=((p.x-180-edit.panX)/edit.zoom+180)/360,y=((p.y-165-edit.panY)/edit.zoom+165)/330;editPoint(x,y,s.id);}start=null;});
 viewport.addEventListener('pointercancel',function(e){pointers.delete(e.pointerId);start=null;pinch=null;});
}
function showEvidence(){var o=detailOrder();openModal('每一把的清点依据','<p>这里展示模拟数据，正式产品将关联原图及修改记录。</p>'+o.batches.map(function(b,i){return '<div class="card" style="margin:12px 0"><div class="row"><strong>第'+(i+1)+'把 · '+count(b)+'根</strong><span class="chip">'+(b.source==='manual'?'人工清点':'逐根复核')+'</span></div><p>'+(b.autoCount==null?'未取得自动结果':'自动 '+b.autoCount+' 根')+' · 最终 '+count(b)+' 根</p>'+(b.autoCount==null?'<div class="hint">本把未使用自动定位结果</div>':'<div style="height:170px;overflow:hidden;border-radius:12px;background:#263b2e">'+endImage(b.ends,false,null,true)+'</div>')+'</div>';}).join(''));}

 case'gallery':openModal('选择示例图片','<p>这是原型内置示例相册，不读取手机照片。</p><div class="gallery-grid">'+[85,77].map(function(n,i){return '<button class="gallery-item" data-action="gallery-use" data-count="'+(n-1)+'">'+endImage(n,false,null,true)+'<span>示例签束 '+(i+1)+'</span></button>';}).join('')+'</div>');break;

 case'guide-begin':closeModal();begin();break;
 case'edit-mode':edit.mode=el.dataset.mode;if(edit.mode!=='view')edit.visible=true;render();break;
 case'zoom-in':edit.zoom=Math.min(3,edit.zoom+.4);updateImageTransform();break;

 case'fit':edit.zoom=1;edit.panX=0;edit.panY=0;updateImageTransform();break;

 case'numbers':edit.numbers=!edit.numbers;render();break;
 case'undo':if(b&&edit.undo.length){b.points=edit.undo.pop();render();}break;
 case'confirm':if(!b||b.error||count(b)<1){toast('请先得到有效数量。');break;}b.status='confirmed';delete b.previous;b.error=null;resetEdit();navigate('summary');toast('本把已确认，请放入已数区');break;
 case'summary':navigate('summary');break;

 case'remove-confirm':var at=o.batches.findIndex(function(x){return x.id===el.dataset.id;});if(at>=0){lastRemoved={orderId:o.id,index:at,batch:clone(o.batches[at])};o.batches.splice(at,1);}closeModal();render();toast('已移除本把','undo-remove');break;
 case'undo-remove':if(lastRemoved&&o&&o.status==='open'&&o.id===lastRemoved.orderId){o.batches.splice(lastRemoved.index,0,lastRemoved.batch);lastRemoved=null;render();toast('已恢复本把');}break;
 case'finalize':finalize();break;

 case'correction-start':var reason=$('correctionReason').value.trim();if(!reason){$('correctionError').textContent='请填写更正原因。';break;}var original=detailOrder();if(o&&o.status==='open'&&o.batches.length)state.savedDrafts.push(clone(o));state.order=clone(original);state.order.id=uid('SD');state.order.status='open';state.order.correctionOf=original.id;state.order.correctionReason=reason;delete state.order.replacedBy;state.order.batches.forEach(function(x){x.id=uid('batch');delete x.previous;});state.detailId=null;resetEdit();navigate('summary');toast('已创建更正草稿，原单保持有效');break;
 case'cancel-correction':openModal('放弃本次更正？','<p>本次更正草稿将结束，原完成记录继续有效。</p>'+btn('放弃更正，保留原单','abandon-correction','danger full')+btn('继续更正','close','full'));break;
 case'abandon-correction':if(o&&o.status==='open'&&o.correctionOf){++jobToken;clearTimeout(timer);state.order=null;resetEdit();navigate('history');toast('已放弃更正，原单保持有效');}break;
 case'save-prices':if(state.role!=='owner')break;var parsed=[],valid=true;state.storeGroups.forEach(function(g){var raw=$('price-'+g.id).value.trim();if(raw===''){parsed.push({id:g.id,name:g.name,price:null});return;}if(!/^\d{1,3}(\.\d{1,2})?$/.test(raw)){valid=false;return;}var parts=raw.split('.');parsed.push({id:g.id,name:g.name,price:Number(parts[0])*100+Number(((parts[1]||'')+'00').slice(0,2))});});if(!valid){toast('请输入0～999.99元，最多两位小数。');break;}state.storeGroups=parsed;render();toast('价格已保存，从下一单起生效');break;
