name: Backend Verify

on:
  pull_request:
    paths:
      - "backend/**"
      - "contracts/**"
      - ".github/workflows/backend-verify.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "contracts/**"
      - ".github/workflows/backend-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: 安装 uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.11.32"
          python-version: "3.13.14"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: 验证后端
        working-directory: backend
        run: make verify
