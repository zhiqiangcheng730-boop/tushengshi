name: Run frontend pnpm check
description: Install the pinned frontend toolchain and run one package script

inputs:
  script:
    description: Exact frontend package script
    required: true

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version: 24.18.0
    - name: Enable Corepack
      shell: bash
      run: corepack enable
    - name: Install frontend dependencies
      shell: bash
      working-directory: frontend
      run: pnpm install --frozen-lockfile
    - name: Run frontend check
      env:
        PACKAGE_SCRIPT: ${{ inputs.script }}
      shell: bash
      working-directory: frontend
      run: pnpm "$PACKAGE_SCRIPT"
